name: Data-free harness
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            python: '3.13'
          - os: ubuntu-24.04
            python: '3.13'
          - os: windows-2022
            python: '3.8'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -B scripts/run_tests.py
      - run: python -B -m dos_re_harness.cli audit-public-tree --staged
        env:
          PYTHONPATH: src
  unicorn:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install unicorn==2.1.4
      - run: python -B scripts/run_tests.py --pattern "test_unicorn*.py"
      - run: python -B scripts/run_tests.py --pattern test_probe_plan.py
