[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dos-re-harness"
version = "0.1.0"
description = "Deterministic DOSBox-X and Ghidra differential reimplementation harness"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
dos-re = "dos_re_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
